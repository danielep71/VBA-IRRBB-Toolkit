name: Bootstrap v0.1.0 tracking

# Controlled, idempotent milestone creation only from the integration branch.
on:
  push:
    branches:
      - "release/v0.1.0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  metadata:
    name: Create milestone and associate foundation issues
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Validate label policy before mutation
        run: |
          node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --self-test
          node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --mode validate
      - name: Reconcile catalogue and issue metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --mode reconcile --repository "${GITHUB_REPOSITORY}"
          python tools/bootstrap_tracking.py
